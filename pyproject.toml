[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "logistics-leaked-key-drill"
version = "0.1.0"
description = "Report and rehearse API-key rotation while measuring logistics blast radius"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
logistics-key-drill = "logistics_key_drill.drill_service:main"

[tool.hatch.build.targets.wheel]
packages = ["src/logistics_key_drill"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

